<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>내 자산 포트폴리오</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 12px}.muted{color:#667085;font-size:13px}
.card{background:white;border:1px solid #e4e7ec;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 2px #00000008}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px;border-radius:13px;background:#f8fafc}.stat b{display:block;font-size:20px;margin-top:5px}
input,button{font:inherit}input{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px;background:white}
button{border:0;border-radius:10px;padding:10px 13px;min-height:42px;background:#111827;color:white;font-weight:650}
button.secondary{background:#eef2f6;color:#172033}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.asset{display:grid;grid-template-columns:1.15fr 1fr 90px 42px;gap:8px;margin:10px 0;align-items:end}.asset label{display:block;font-size:12px;color:#667085;margin-bottom:5px}
.remove{background:#fff0f0;color:#b42318}.bar{height:9px;background:#e9edf2;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#667085}
.good{color:#087443}.bad{color:#b42318}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:120px}
@media(max-width:560px){.asset{grid-template-columns:1fr 1fr}.asset .remove{grid-column:2}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>내 자산 포트폴리오</h1><div class="muted">내 기기에만 저장되는 개인용 자산관리</div></div><button id="install" class="secondary" hidden>앱 설치</button></div>

<div class="grid">
<div class="stat"><span class="muted">현재 총자산</span><b id="total">0원</b></div>
<div class="stat"><span class="muted">목표비중</span><b id="targetTotal">0%</b></div>
</div>

<section class="card">
<div class="row"><div><h2>자산 구성</h2><div class="muted">금액과 목표비중을 직접 입력하세요.</div></div><button id="add">+ 자산</button></div>
<div id="assets"></div>
</section>

<section class="card">
<h2>현재 비중</h2><div id="allocation"></div>
</section>

<section class="card">
<h2>리밸런싱</h2><div class="muted" style="margin-bottom:10px">현재 총자산 기준으로 목표비중까지 필요한 금액입니다.</div>
<div id="rebalance"></div>
</section>

<section class="card">
<h2>추가 투자금 배분</h2>
<label class="muted">이번 달 추가 투자금</label>
<input id="extra" type="number" min="0" value="0" inputmode="numeric" style="margin-top:5px">
<div id="recommend" style="margin-top:12px"></div>
</section>

<section class="card">
<h2>데이터</h2>
<div class="actions">
<button id="export">백업 파일 저장</button>
<button id="importBtn" class="secondary">백업 불러오기</button>
<input id="file" type="file" accept=".json" hidden>
</div>
<p class="muted" style="margin-bottom:0">데이터는 이 브라우저의 기기 내부 저장소에 보관됩니다. 휴대폰을 바꾸거나 앱 데이터를 삭제하면 사라질 수 있으므로 백업 파일을 보관하세요.</p>
</section>
</main>

<script>
const KEY="my-asset-portfolio-v1";
let data=JSON.parse(localStorage.getItem(KEY)||"null")||[
{name:"예금",amount:60000000,target:60},
{name:"S&P500 ETF",amount:20000000,target:20},
{name:"채권",amount:10000000,target:10},
{name:"현금",amount:10000000,target:10}
];

const $=s=>document.querySelector(s);
const won=n=>Math.round(n).toLocaleString("ko-KR")+"원";
const pct=n=>n.toFixed(1)+"%";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){
 $("#assets").innerHTML=data.map((x,i)=>`
 <div class="asset">
  <div><label>자산명</label><input class="name" data-i="${i}" value="${esc(x.name)}"></div>
  <div><label>현재금액</label><input class="amount" data-i="${i}" type="number" min="0" value="${x.amount}"></div>
  <div><label>목표 %</label><input class="target" data-i="${i}" type="number" min="0" max="100" step=".1" value="${x.target}"></div>
  <button class="remove" data-i="${i}" aria-label="삭제">×</button>
 </div>`).join("");
 document.querySelectorAll("#assets input").forEach(el=>el.addEventListener("input",read));
 document.querySelectorAll(".remove").forEach(el=>el.addEventListener("click",()=>{
   if(data.length>1){data.splice(+el.dataset.i,1);save();render();update()}
 }));
}
function read(){
 document.querySelectorAll(".name").forEach((e,i)=>data[i].name=e.value||("자산 "+(i+1)));
 document.querySelectorAll(".amount").forEach((e,i)=>data[i].amount=Math.max(0,+e.value||0));
 document.querySelectorAll(".target").forEach((e,i)=>data[i].target=Math.min(100,Math.max(0,+e.value||0)));
 save();update();
}
function update(){
 const total=data.reduce((s,x)=>s+x.amount,0);
 const target=data.reduce((s,x)=>s+x.target,0);
 $("#total").textContent=won(total); $("#targetTotal").textContent=pct(target);
 $("#allocation").innerHTML=data.map(x=>{
   const p=total?x.amount/total*100:0;
   return `<div style="margin:12px 0"><div class="row"><span>${esc(x.name)}</span><span>${won(x.amount)} · ${pct(p)} / 목표 ${pct(x.target)}</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,p)}%"></div></div></div>`;
 }).join("");
 $("#rebalance").innerHTML=data.map(x=>{
   const diff=total*x.target/100-x.amount;
   return `<div class="row" style="padding:6px 0"><span>${esc(x.name)}</span><span class="${diff>=0?'good':'bad'}">${diff>=0?'추가 필요 ':'초과 '}${won(Math.abs(diff))}</span></div>`;
 }).join("");
 const extra=Math.max(0,+$("#extra").value||0), base=total+extra;
 const gaps=data.map(x=>Math.max(0,base*x.target/100-x.amount));
 const need=gaps.reduce((s,x)=>s+x,0);
 $("#recommend").innerHTML=extra&&need ? data.map((x,i)=>{
   const a=extra*gaps[i]/need;
   return `<div class="row" style="padding:6px 0"><span>${esc(x.name)}</span><b>${won(a)}</b></div>`;
 }).join("") : `<span class="muted">추가 투자금을 입력하면 목표비중에 맞춰 자동 배분합니다.</span>`;
}
$("#add").onclick=()=>{data.push({name:"새 자산",amount:0,target:0});save();render();update()};
$("#extra").oninput=update;

$("#export").onclick=()=>{
 const blob=new Blob([JSON.stringify({version:1,data,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="내-자산포트폴리오-백업.json";a.click();URL.revokeObjectURL(a.href);
};
$("#importBtn").onclick=()=>$("#file").click();
$("#file").onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{
   try{
     const obj=JSON.parse(r.result);
     if(!Array.isArray(obj.data)||!obj.data.length)throw Error();
     data=obj.data.map(x=>({name:String(x.name||"자산"),amount:Math.max(0,+x.amount||0),target:Math.min(100,Math.max(0,+x.target||0))}));
     save();render();update();alert("백업을 불러왔습니다.");
   }catch{alert("올바른 백업 파일이 아닙니다.")}
 };r.readAsText(f);e.target.value="";
};

let deferred;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#install").hidden=false});
$("#install").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("#install").hidden=true};
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
render();update();
</script>
</body>
</html>
