<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>내 자산 포트폴리오</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1440px;margin:auto;padding:24px 24px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}
h1{font-size:27px;margin:0}h2{font-size:17px;margin:0 0 12px}.muted{color:#667085;font-size:13px}
.card{background:white;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:0;box-shadow:0 1px 2px #00000008;min-width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{padding:16px;border-radius:13px;background:#f8fafc}.stat b{display:block;font-size:23px;margin-top:5px}
.dashboard{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:16px;align-items:start}.left-col,.right-col{display:grid;gap:16px;min-width:0}
input,button{font:inherit}input{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px;background:white;min-width:0}
button{border:0;border-radius:10px;padding:10px 13px;min-height:42px;background:#111827;color:white;font-weight:650;cursor:pointer}
button.secondary{background:#eef2f6;color:#172033}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.asset{display:grid;grid-template-columns:26px minmax(110px,1.1fr) minmax(120px,1fr) 86px 42px;gap:8px;margin:10px 0;align-items:end}.asset label{display:block;font-size:12px;color:#667085;margin-bottom:5px}.asset-color{width:26px;height:42px;padding:3px;border:1px solid #d0d5dd;border-radius:8px;background:white;cursor:pointer;align-self:end}
.remove{background:#fff0f0;color:#b42318}.bar{height:9px;background:#e9edf2;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#667085}
.good{color:#087443}.bad{color:#b42318}.allocation-item{margin:14px 0}.legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;flex:0 0 auto}.pie-layout{display:grid;grid-template-columns:minmax(160px,220px) minmax(0,1fr);align-items:center;gap:20px}.pie-svg{width:100%;height:auto;display:block;max-width:240px;margin:auto}.pie-legend{display:grid;gap:10px}.legend-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}.legend-name{display:flex;align-items:center;min-width:0}.legend-name span:last-child{overflow-wrap:anywhere}.empty-chart{color:#667085;font-size:13px;text-align:center;padding:24px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:120px}
@media(max-width:980px){main{padding:18px 14px 36px}.dashboard{grid-template-columns:1fr}.right-col{grid-template-columns:repeat(2,minmax(0,1fr))}.right-col .card:last-child{grid-column:1/-1}}
@media(max-width:600px){main{padding:14px 10px 28px}h1{font-size:22px}.grid{gap:8px}.stat{padding:12px}.stat b{font-size:18px}.right-col{grid-template-columns:1fr}.right-col .card:last-child{grid-column:auto}.asset{grid-template-columns:26px minmax(0,1fr) minmax(0,1fr);gap:7px}.asset .name-wrap{grid-column:2}.asset .amount-wrap{grid-column:3}.asset .target-wrap{grid-column:2}.asset .remove{grid-column:3}.asset-color{grid-row:1 / span 2}.pie-layout{grid-template-columns:minmax(120px,160px) minmax(0,1fr);gap:10px}.pie-legend{gap:7px}.legend-row{font-size:12px}}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>내 자산 포트폴리오</h1><div class="muted">내 기기에만 저장되는 개인용 자산관리</div></div><button id="install" class="secondary" hidden>앱 설치</button></div>

<div class="grid">
<div class="stat"><span class="muted">현재 총자산</span><b id="total">0원</b></div>
<div class="stat"><span class="muted">목표비중</span><b id="targetTotal">0%</b></div>
</div>

<div class="dashboard">
<div class="left-col">
<section class="card">
<div class="row"><div><h2>자산 구성</h2><div class="muted">금액·목표비중·색상을 직접 설정하세요.</div></div><button id="add">+ 자산</button></div>
<div id="assets"></div>
</section>
<section class="card">
<h2>리밸런싱</h2><div class="muted" style="margin-bottom:10px">현재 총자산 기준으로 목표비중까지 필요한 금액입니다.</div>
<div id="rebalance"></div>
</section>
<section class="card">
<h2>추가 투자금 배분</h2>
<label class="muted">이번 달 추가 투자금</label>
<input id="extra" type="number" min="0" value="0" inputmode="numeric" style="margin-top:5px">
<div id="recommend" style="margin-top:12px"></div>
</section>
</div>
<div class="right-col">
<section class="card">
<h2>자산 비중</h2><div class="muted" style="margin-bottom:12px">원형 그래프로 전체 자산 구성을 확인하세요.</div>
<div id="pieChart"></div>
</section>
<section class="card">
<h2>현재 비중 상세</h2><div id="allocation"></div>
</section>
<section class="card">
<h2>데이터</h2>
<div class="actions">
<button id="export">백업 파일 저장</button>
<button id="importBtn" class="secondary">백업 불러오기</button>
<input id="file" type="file" accept=".json" hidden>
</div>
<p class="muted" style="margin-bottom:0">데이터는 이 브라우저의 기기 내부 저장소에 보관됩니다. 휴대폰을 바꾸거나 앱 데이터를 삭제하면 사라질 수 있으므로 백업 파일을 보관하세요.</p>
</section>
</div>
</div>
</main>

<script>
const KEY="my-asset-portfolio-v1";
const COLORS=["#4F46E5","#0D9488","#F59E0B","#E11D48","#0284C7","#7C3AED","#65A30D","#EA580C","#0891B2","#C026D3"];
let data=JSON.parse(localStorage.getItem(KEY)||"null")||[
{name:"예금",amount:60000000,target:60,color:COLORS[0]},
{name:"S&P500 ETF",amount:20000000,target:20,color:COLORS[1]},
{name:"채권",amount:10000000,target:10,color:COLORS[2]},
{name:"현금",amount:10000000,target:10,color:COLORS[3]}
];
data=data.map((x,i)=>({...x,color:x.color||COLORS[i%COLORS.length]}));

const $=s=>document.querySelector(s);
const won=n=>Math.round(n).toLocaleString("ko-KR")+"원";
const pct=n=>n.toFixed(1)+"%";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){
 $("#assets").innerHTML=data.map((x,i)=>`
 <div class="asset">
  <input class="asset-color" data-i="${i}" type="color" value="${x.color}" aria-label="${esc(x.name)} 색상">
  <div class="name-wrap"><label>자산명</label><input class="name" data-i="${i}" value="${esc(x.name)}"></div>
  <div class="amount-wrap"><label>현재금액</label><input class="amount" data-i="${i}" type="number" min="0" value="${x.amount}"></div>
  <div class="target-wrap"><label>목표 %</label><input class="target" data-i="${i}" type="number" min="0" max="100" step=".1" value="${x.target}"></div>
  <button class="remove" data-i="${i}" aria-label="삭제">×</button>
 </div>`).join("");
 document.querySelectorAll("#assets input:not(.asset-color)").forEach(el=>el.addEventListener("input",read));
 document.querySelectorAll(".asset-color").forEach(el=>el.addEventListener("input",e=>{data[+e.target.dataset.i].color=e.target.value;save();update()}));
 document.querySelectorAll(".remove").forEach(el=>el.addEventListener("click",()=>{
   if(data.length>1){data.splice(+el.dataset.i,1);save();render();update()}
 }));
}
function read(){
 document.querySelectorAll(".name").forEach((e,i)=>data[i].name=e.value||("자산 "+(i+1)));
 document.querySelectorAll(".amount").forEach((e,i)=>data[i].amount=Math.max(0,+e.value||0));
 document.querySelectorAll(".target").forEach((e,i)=>data[i].target=Math.min(100,Math.max(0,+e.value||0)));
 save();update();
}
function update(){
 const total=data.reduce((s,x)=>s+x.amount,0);
 const target=data.reduce((s,x)=>s+x.target,0);
 $("#total").textContent=won(total); $("#targetTotal").textContent=pct(target);
 const actual=data.map(x=>total?x.amount/total*100:0);
 $("#allocation").innerHTML=data.map((x,i)=>{
   const p=actual[i];
   return `<div class="allocation-item"><div class="row"><span class="legend-name"><i class="legend-dot" style="background:${x.color}"></i>${esc(x.name)}</span><span>${pct(p)}</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,p)}%;background:${x.color}"></div></div><div class="muted" style="margin-top:4px">${won(x.amount)} · 목표 ${pct(x.target)}</div></div>`;
 }).join("");
 const positive=data.map((x,i)=>({...x,share:actual[i]})).filter(x=>x.amount>0);
 if(!positive.length){$("#pieChart").innerHTML='<div class="empty-chart">자산 금액을 입력하면 원형 그래프가 표시됩니다.</div>'}
 else {
   let offset=0; const circumference=2*Math.PI*65;
   const circles=positive.map(x=>{const len=circumference*x.share/100;const c=`<circle cx="90" cy="90" r="65" fill="none" stroke="${x.color}" stroke-width="26" stroke-dasharray="${len} ${circumference-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 90 90)"/>`;offset+=len;return c}).join("");
   $("#pieChart").innerHTML=`<div class="pie-layout"><svg class="pie-svg" viewBox="0 0 180 180" role="img" aria-label="현재 자산 구성 원형 그래프"><circle cx="90" cy="90" r="65" fill="none" stroke="#eef1f5" stroke-width="26"/>${circles}<text x="90" y="84" text-anchor="middle" font-size="11" fill="#667085">총자산</text><text x="90" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">${total>=100000000?(total/100000000).toFixed(2)+'억':Math.round(total/10000).toLocaleString('ko-KR')+'만'}</text></svg><div class="pie-legend">${positive.map(x=>`<div class="legend-row"><span class="legend-name"><i class="legend-dot" style="background:${x.color}"></i><span>${esc(x.name)}</span></span><b>${pct(x.share)}</b></div>`).join("")}</div></div>`;
 }
 $("#rebalance").innerHTML=data.map(x=>{
   const diff=total*x.target/100-x.amount;
   return `<div class="row" style="padding:8px 0;border-bottom:1px solid #f0f2f5"><span class="legend-name"><i class="legend-dot" style="background:${x.color}"></i>${esc(x.name)}</span><span class="${diff>=0?'good':'bad'}">${diff>=0?'추가 필요 ':'초과 '}${won(Math.abs(diff))}</span></div>`;
 }).join("");
 const extra=Math.max(0,+$("#extra").value||0), base=total+extra;
 const gaps=data.map(x=>Math.max(0,base*x.target/100-x.amount));
 const need=gaps.reduce((s,x)=>s+x,0);
 $("#recommend").innerHTML=extra&&need ? data.map((x,i)=>{
   const a=extra*gaps[i]/need;
   return `<div class="row" style="padding:7px 0"><span class="legend-name"><i class="legend-dot" style="background:${x.color}"></i>${esc(x.name)}</span><b>${won(a)}</b></div>`;
 }).join("") : `<span class="muted">추가 투자금을 입력하면 목표비중에 맞춰 자동 배분합니다.</span>`;
}
$("#add").onclick=()=>{data.push({name:"새 자산",amount:0,target:0,color:COLORS[data.length%COLORS.length]});save();render();update()};
$("#extra").oninput=update;

$("#export").onclick=()=>{
 const blob=new Blob([JSON.stringify({version:1,data,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="내-자산포트폴리오-백업.json";a.click();URL.revokeObjectURL(a.href);
};
$("#importBtn").onclick=()=>$("#file").click();
$("#file").onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{
   try{
     const obj=JSON.parse(r.result);
     if(!Array.isArray(obj.data)||!obj.data.length)throw Error();
     data=obj.data.map((x,i)=>({name:String(x.name||"자산"),amount:Math.max(0,+x.amount||0),target:Math.min(100,Math.max(0,+x.target||0)),color:/^#[0-9a-f]{6}$/i.test(x.color||"")?x.color:COLORS[i%COLORS.length]}));
     save();render();update();alert("백업을 불러왔습니다.");
   }catch{alert("올바른 백업 파일이 아닙니다.")}
 };r.readAsText(f);e.target.value="";
};

let deferred;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#install").hidden=false});
$("#install").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("#install").hidden=true};
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
render();update();
</script>
</body>
</html>
